<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5c0613">
  <title>Вход волонтёра — ДоброЗАУ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="/static/static/logo.png.jpg">
  <style>
    html, body {
      background-color: #260208;
      overflow-x: hidden;
      max-width: 100%;
    }
    body {
      background: linear-gradient(180deg, #6b0c1c 0%, #4a0510 50%, #260208 100%);
      background-attachment: fixed;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    h1 {
      font-family: 'Unbounded', 'Manrope', sans-serif;
    }

    @view-transition { navigation: auto; }

    html:active-view-transition-type(circle-wipe)::view-transition-old(root) {
      animation: none;
      z-index: 1;
    }
    html:active-view-transition-type(circle-wipe)::view-transition-new(root) {
      z-index: 2;
      animation: 0.52s cubic-bezier(0.22, 1, 0.36, 1) both circleReveal;
    }
    @keyframes circleReveal {
      from { clip-path: circle(0px at var(--click-x, 85%) var(--click-y, 32px)); }
      to   { clip-path: circle(150vmax at var(--click-x, 85%) var(--click-y, 32px)); }
    }

    html:active-view-transition-type(curtain-wipe)::view-transition-old(root) {
      animation: 0.42s cubic-bezier(0.65, 0, 0.35, 1) both curtainCover;
      z-index: 1;
    }
    html:active-view-transition-type(curtain-wipe)::view-transition-new(root) {
      animation: 0.46s cubic-bezier(0.65, 0, 0.35, 1) both curtainUncover;
      z-index: 2;
    }
    @keyframes curtainCover {
      from { opacity: 1; filter: brightness(1); transform: scale(1); }
      to   { opacity: 0.35; filter: brightness(0.45); transform: scale(0.985); }
    }
    @keyframes curtainUncover {
      from { clip-path: inset(100% 0 0 0); box-shadow: 0 -4px 24px rgba(245, 158, 11, 0.65); }
      to   { clip-path: inset(0 0 0 0); box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
    }

    #amberCurtainLine {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 4px;
      background: linear-gradient(90deg, #b45309, #fbbf24, #f59e0b, #fbbf24, #b45309);
      box-shadow: 0 0 22px 4px rgba(245, 158, 11, 0.7);
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
    }
    #amberCurtainLine.active {
      animation: amberSweep 0.46s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    @keyframes amberSweep {
      0%   { opacity: 1; transform: translateY(0vh); }
      85%  { opacity: 1; transform: translateY(-98vh); }
      100% { opacity: 0; transform: translateY(-102vh); }
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="relative z-10 bg-[#faf7f5] max-w-md w-full p-8 rounded-2xl shadow-2xl border border-white/50">
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-[#5c0613]">ДоброЗАУ</h1>
      <p class="text-xs text-[#6e585c] mt-1.5 font-medium">Личный кабинет волонтёра</p>
    </div>

    <!-- Вкладки Вход / Регистрация -->
    <div class="flex border-b border-[#ebe2de] mb-6">
      <button id="tab-login-btn" type="button" onclick="showTab('login')" class="w-1/2 py-2.5 font-bold text-sm border-b-2 border-[#5c0613] text-[#5c0613] transition">Вход</button>
      <button id="tab-reg-btn" type="button" onclick="showTab('reg')" class="w-1/2 py-2.5 font-semibold text-sm border-b-2 border-transparent text-[#9c8a8d] hover:text-[#6e585c] transition">Регистрация</button>
    </div>

    <!-- Форма Входа -->
    <form id="form-login" action="/auth/login" method="post" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-[#6e585c] mb-1">Логин</label>
        <input type="text" name="login" required autocomplete="username" placeholder="Например: ivan_ivanov" class="w-full px-3.5 py-2.5 bg-white border border-[#d6ccc8] rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#5c0613] focus:border-transparent">
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#6e585c] mb-1">Пароль</label>
        <input type="password" name="password" required autocomplete="current-password" placeholder="Введите пароль" class="w-full px-3.5 py-2.5 bg-white border border-[#d6ccc8] rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#5c0613] focus:border-transparent">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-[#6b0c1c] to-[#42040d] text-white py-2.5 rounded-lg text-sm font-bold hover:opacity-95 transition shadow-md">Войти в кабинет</button>
    </form>

    <!-- Форма Регистрации -->
    <form id="form-reg" action="/auth/register" method="post" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-[#6e585c] mb-1">ФИО (как в списках)</label>
        <input type="text" name="name" required autocomplete="name" placeholder="Иванов Иван Иванович" class="w-full px-3.5 py-2.5 bg-white border border-[#d6ccc8] rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#5c0613] focus:border-transparent">
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#6e585c] mb-1">Придумайте логин (латиница, от 3 символов)</label>
        <input type="text" name="login" required autocomplete="username" minlength="3" maxlength="32" placeholder="ivanov_i" class="w-full px-3.5 py-2.5 bg-white border border-[#d6ccc8] rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#5c0613] focus:border-transparent">
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#6e585c] mb-1">Придумайте пароль (от 6 символов)</label>
        <input type="password" name="password" required autocomplete="new-password" minlength="6" maxlength="128" placeholder="Минимум 6 символов" class="w-full px-3.5 py-2.5 bg-white border border-[#d6ccc8] rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#5c0613] focus:border-transparent">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-[#6b0c1c] to-[#42040d] text-white py-2.5 rounded-lg text-sm font-bold hover:opacity-95 transition shadow-md">Зарегистрироваться</button>
    </form>

    <div class="mt-6 text-center">
      <a href="/" class="text-xs font-semibold text-[#6e585c] hover:text-[#5c0613] transition">← Вернуться на главную</a>
    </div>
  </div>

  <div id="amberCurtainLine"></div>

  <script>
    function showTab(tab) {
      if (tab === 'login') {
        document.getElementById('form-login').classList.remove('hidden');
        document.getElementById('form-reg').classList.add('hidden');
        document.getElementById('tab-login-btn').className = "w-1/2 py-2.5 font-bold text-sm border-b-2 border-[#5c0613] text-[#5c0613] transition";
        document.getElementById('tab-reg-btn').className = "w-1/2 py-2.5 font-semibold text-sm border-b-2 border-transparent text-[#9c8a8d] hover:text-[#6e585c] transition";
      } else {
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-reg').classList.remove('hidden');
        document.getElementById('tab-reg-btn').className = "w-1/2 py-2.5 font-bold text-sm border-b-2 border-[#5c0613] text-[#5c0613] transition";
        document.getElementById('tab-login-btn').className = "w-1/2 py-2.5 font-semibold text-sm border-b-2 border-transparent text-[#9c8a8d] hover:text-[#6e585c] transition";
      }
    }

    document.addEventListener('pointerdown', (e) => {
      const x = Math.round(e.clientX) + 'px';
      const y = Math.round(e.clientY) + 'px';
      document.documentElement.style.setProperty('--click-x', x);
      document.documentElement.style.setProperty('--click-y', y);
      sessionStorage.setItem('vt_click_x', x);
      sessionStorage.setItem('vt_click_y', y);
    }, { passive: true });

    const savedX = sessionStorage.getItem('vt_click_x');
    const savedY = sessionStorage.getItem('vt_click_y');
    if (savedX && savedY) {
      document.documentElement.style.setProperty('--click-x', savedX);
      document.documentElement.style.setProperty('--click-y', savedY);
    }

    function getTransitionType(fromUrl, toUrl) {
      if (!fromUrl || !toUrl) return 'curtain-wipe';
      const toPath = new URL(toUrl).pathname;
      if (toPath === '/profile' || toPath === '/login') return 'circle-wipe';
      return 'curtain-wipe';
    }

    window.addEventListener('pageswap', (e) => {
      if (!e.viewTransition) return;
      const type = getTransitionType(window.location.href, e.activation?.entry?.url);
      e.viewTransition.types.add(type);
      if (type === 'curtain-wipe') {
        const line = document.getElementById('amberCurtainLine');
        if (line) {
          line.classList.remove('active');
          void line.offsetWidth;
          line.classList.add('active');
        }
      }
    });

    window.addEventListener('pagereveal', (e) => {
      if (!e.viewTransition) return;
      const type = getTransitionType(e.activation?.from?.url, window.location.href);
      e.viewTransition.types.add(type);
    });
  </script>
</body>
</html>
