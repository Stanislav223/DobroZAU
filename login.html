<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5c0613">
  <title>Вход в личный кабинет — ДоброЗАУ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="/static/static/logo.png.jpg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    html, body { background-color: #260208; min-height: 100dvh; }
    body {
      background: linear-gradient(180deg, #6b0c1c 0%, #4a0510 50%, #260208 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 20px 16px;
    }
    .auth-card {
      width: 100%; max-width: 420px; background: #faf7f5; border-radius: 22px;
      padding: 28px 24px; box-shadow: 0 20px 48px rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.55);
    }
    .brand { text-align: center; margin-bottom: 20px; }
    .brand h1 { font-family: 'Unbounded', sans-serif; font-size: 1.4rem; color: #5c0613; }
    .brand p { font-size: 0.86rem; color: #6e585c; margin-top: 4px; font-weight: 600; }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #ebe2de; padding: 4px; border-radius: 12px; margin-bottom: 20px; }
    .tab-btn {
      border: none; background: transparent; padding: 9px; border-radius: 9px;
      font-size: 0.86rem; font-weight: 700; color: #6e585c; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active { background: #ffffff; color: #5c0613; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }

    .form-panel { display: none; flex-direction: column; gap: 14px; }
    .form-panel.active { display: flex; }
    .field label { display: block; font-size: 0.8rem; font-weight: 700; color: #473639; margin-bottom: 5px; }
    .field input {
      width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid #d6ccc8;
      background: #ffffff; font-size: 0.94rem; outline: none; color: #23090e;
    }
    .field input:focus { border-color: #5c0613; }
    .submit-btn {
      width: 100%; margin-top: 4px; padding: 12px; border: none; border-radius: 11px;
      background: linear-gradient(135deg, #6b0c1c 0%, #42040d 100%); color: #ffffff;
      font-size: 0.94rem; font-weight: 700; cursor: pointer;
    }
    .back-link {
      display: block; text-align: center; margin-top: 18px;
      font-size: 0.84rem; font-weight: 700; color: #5c0613; text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <h1>ДоброЗАУ</h1>
      <p>Личный кабинет волонтёра</p>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Вход</button>
      <button type="button" class="tab-btn" id="tabReg" onclick="switchTab('register')">Регистрация</button>
    </div>

    <form action="/auth/login" method="post" class="form-panel active" id="panelLogin">
      <div class="field">
        <label>Логин</label>
        <input type="text" name="login" required placeholder="Например: ivan_ivanov">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" name="password" required placeholder="Введите пароль">
      </div>
      <button type="submit" class="submit-btn">Войти в кабинет</button>
    </form>

    <form action="/auth/register" method="post" class="form-panel" id="panelRegister">
      <div class="field">
        <label>ФИО (как в списках)</label>
        <input type="text" name="name" required placeholder="Иванов Иван Иванович">
      </div>
      <div class="field">
        <label>Придумайте логин (латиница, от 3 символов)</label>
        <input type="text" name="login" required placeholder="ivanov_i">
      </div>
      <div class="field">
        <label>Придумайте пароль (от 6 символов)</label>
        <input type="password" name="password" required placeholder="Минимум 6 символов">
      </div>
      <button type="submit" class="submit-btn">Зарегистрироваться</button>
    </form>

    <a href="/" class="back-link">← Вернуться на главную</a>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabReg').classList.toggle('active', tab === 'register');
      document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
      document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
    }
  </script>
</body>
</html>
