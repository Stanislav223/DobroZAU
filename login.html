<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5c0613">
  <title>Вход волонтёра — ДоброЗАУ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/static/static/logo.png.jpg">
  <style>
    html, body {
      background-color: #5c0613;
      overflow-x: hidden;
      max-width: 100%;
    }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    }
    h1 {
      font-family: 'Unbounded', 'Manrope', sans-serif;
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="bg-white max-w-md w-full p-8 rounded-2xl shadow-xl border border-white/10">
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-[#5c0613]">ДоброЗАУ</h1>
      <p class="text-xs text-slate-500 mt-1.5 font-medium">Личный кабинет волонтёра</p>
    </div>

    <!-- Вкладки Вход / Регистрация -->
    <div class="flex border-b border-slate-200 mb-6">
      <button id="tab-login-btn" type="button" onclick="showTab('login')" class="w-1/2 py-2.5 font-bold text-sm border-b-2 border-[#5c0613] text-[#5c0613] transition">Вход</button>
      <button id="tab-reg-btn" type="button" onclick="showTab('reg')" class="w-1/2 py-2.5 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition">Регистрация</button>
    </div>

    <!-- Форма Входа -->
    <form id="form-login" action="/auth/login" method="post" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Логин</label>
        <input type="text" name="login" required autocomplete="username" placeholder="Например: ivan_ivanov" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#5c0613] focus:border-transparent">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Пароль</label>
        <input type="password" name="password" required autocomplete="current-password" placeholder="Введите пароль" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#5c0613] focus:border-transparent">
      </div>
      <button type="submit" class="w-full bg-[#5c0613] text-white py-2.5 rounded-lg text-sm font-bold hover:bg-[#3f030b] transition shadow-sm">Войти в кабинет</button>
    </form>

    <!-- Форма Регистрации -->
    <form id="form-reg" action="/auth/register" method="post" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ФИО (как в списках)</label>
        <input type="text" name="name" required autocomplete="name" placeholder="Иванов Иван Иванович" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#5c0613] focus:border-transparent">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Придумайте логин (латиница, от 3 символов)</label>
        <input type="text" name="login" required autocomplete="username" minlength="3" maxlength="32" placeholder="ivanov_i" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#5c0613] focus:border-transparent">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Придумайте пароль (от 6 символов)</label>
        <input type="password" name="password" required autocomplete="new-password" minlength="6" maxlength="128" placeholder="Минимум 6 символов" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#5c0613] focus:border-transparent">
      </div>
      <button type="submit" class="w-full bg-[#5c0613] text-white py-2.5 rounded-lg text-sm font-bold hover:bg-[#3f030b] transition shadow-sm">Зарегистрироваться</button>
    </form>

    <div class="mt-6 text-center">
      <a href="/" class="text-xs font-medium text-slate-400 hover:text-[#5c0613] transition">← Вернуться на главную</a>
    </div>
  </div>

  <script>
    function showTab(tab) {
      if (tab === 'login') {
        document.getElementById('form-login').classList.remove('hidden');
        document.getElementById('form-reg').classList.add('hidden');
        document.getElementById('tab-login-btn').className = "w-1/2 py-2.5 font-bold text-sm border-b-2 border-[#5c0613] text-[#5c0613] transition";
        document.getElementById('tab-reg-btn').className = "w-1/2 py-2.5 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition";
      } else {
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-reg').classList.remove('hidden');
        document.getElementById('tab-reg-btn').className = "w-1/2 py-2.5 font-bold text-sm border-b-2 border-[#5c0613] text-[#5c0613] transition";
        document.getElementById('tab-login-btn').className = "w-1/2 py-2.5 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition";
      }
    }
  </script>
</body>
</html>
